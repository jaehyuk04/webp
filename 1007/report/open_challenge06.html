<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>별 문자 출력하기</title>
    <script>
        function printStar(n) {
            for (let i = 1; i <= n; i++) {
                for (let j = 0; j < i; j++) {
                    document.write("*");
                }
                document.write("<br>");
            }
        }
    </script>
</head>

<body>
    <h3>별 문자 출력하기</h3>
    <hr>
    <script>
        let input = prompt("정수를 입력하세요");
        let n = parseInt(input);

        if (isNaN(n) || n <= 0 ) {
            document.write("입력 오류입니다.");
        } else {
            printStar(n);
        }
    </script>
</body>

</html>
