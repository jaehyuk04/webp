<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>리터럴</title>
</head>

<body>
    <h3>리터럴</h3>
    <hr>
    <script>
        let oct = 0o15; // 015는8진수. 10진수로13
        let hex = 0x15; // 0x14는16진수. 10진수로21
        let condition = true; // True로하면안됨
        document.write("8진수015는십진수로" + oct + "<br>");
        document.write("16진수0x15는십진수로" + hex + "<br>");
        document.write("condition은" + condition + "<br>");
        document.write('문자열: 단일인용부호로도표현' + "<br>");
        document.write("그녀는\"누구세요\"라고했습니다.");
    </script>
</body>

</html>
