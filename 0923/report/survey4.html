<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>소프트웨어 기술 선호에 관한 설문</title>
  <link href="survey4.css" type="text/css" rel="stylesheet">
</head>

<body>

  <header>
    <h1>설문지</h1>
    <p>소프트웨어 기술에 대한 의견을 듣습니다. 많은 참여 부탁드립니다.</p>
  </header>
  <hr>

  <form>
    <fieldset>
      <div>
        <label class="title" style="color: blue;">학년</label>
        <input type="radio" name="grade" id="g1" checked><label for="g1">1학년</label>
        <input type="radio" name="grade" id="g2"><label for="g2">2학년</label>
        <input type="radio" name="grade" id="g3"><label for="g3">3학년</label>
        <input type="radio" name="grade" id="g4"><label for="g4">4학년</label>
      </div>

      <div>
        <label class="title" style="color: blue;">성별</label>
        <input type="radio" name="gender" id="m" ><label for="m">남</label>
        <input type="radio" name="gender" id="f" checked><label for="f">여</label>
      </div>

      <div>
        <label class="title" style="color: blue;">관심 분야</label>
        <select name="field">
          <option value="mobile">모바일 소프트웨어</option>
          <option value="web">웹 프로그래밍</option>
          <option value="ai">인공지능</option>
        </select>
      </div>

      <div>
        <label class="title" style="color: blue;">진로(다중 선택)</label>
        <input type="checkbox" id="c1" checked><label for="c1">개발</label>
        <input type="checkbox" id="c2"><label for="c2">기획</label>
        <input type="checkbox" id="c3"><label for="c3">영업</label>
        <input type="checkbox" id="c4"><label for="c4">창업</label>
      </div>

      <div>
        <label class="title" style="color: blue;">남기고 싶은 말</label>
        <textarea rows="5" cols="30" placeholder="글을 남겨주세요" style="font-family: sans-serif;"></textarea>
      </div>
    </fieldset>
  </form>

  <footer>
    <p>Copyright 2022 by Kitae</p>
  </footer>

</body>

</html>
