<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>:hover 활용</title>
    <style>
        div.card {
            width: 150px;
            height: 200px;
            background-image: url("트럼프_카드_앞면.png");
            background-size: cover;
        }

        div.card:hover {
            background-image: url("트럼프_카드_뒷면.png");
        }
    </style>
</head>

<body>
    <h3>:hover 활용</h3>
    <hr>
    <p>마우스를 올리면 카드의 앞면이 보인다.</p>
    <div class="card"></div>
</body>

</html>
