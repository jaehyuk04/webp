<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>text-shadow와 box-shadow</title>
    <style>
        h1 {
            color: gold;
            text-shadow: 3px 3px 3px navy;
        }

        img {
            width: 200px;
            height: 150px;
            margin: 10px;
        }

        img:hover {
            box-shadow: 5px 5px 10px gray;
        }
    </style>
</head>

<body>
    <h1>Most Visited Pages</h1>
    <hr>
    <img src="naver.png" alt="NAVER.png">
    <img src="1등 인터넷뉴스 조선닷컴.png" alt="1등 인터넷뉴스 조선닷컴.png">
    <img src="Amazon.com.png" alt="Amazon.com.png">
</body>

</html>
