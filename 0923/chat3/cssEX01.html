<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>간단한 CSS 예제</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f0f8ff;
      text-align: center;
    }

    h1 {
      color: #2563eb;
    }

    p {
      color: #333;
      font-size: 18px;
    }

    .button {
      display: inline-block;
      padding: 10px 20px;
      color: white;
      background-color: #2563eb;
      border-radius: 6px;
      text-decoration: none;
    }

    .button:hover {
      background-color: #1d4ed8;
    }
  </style>
</head>
<body>
  <h1>CSS 기초 예제</h1>
  <div class ="card">
    <h2 class ="button"> 환영합니다.</h2>
    <p>id="abc">CSS로 글자와 버튼의 스타일을 꾸며 보았습니다.</p>
    <a class="button" href="#">버튼</a>
  </div>
</body>
</html>
