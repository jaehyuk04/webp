<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>animation</title>
    <style>
        img {
            width: 150px;
            animation: swing 0.5s ease-in-out infinite alternate;
        }

        @keyframes swing {
            from {
                transform: rotate(-90deg);
            }

            to {
                transform: rotate(90deg);
            }
        }
    </style>
</head>

<body>
    <h3>어지러워요</h3>
    <hr>
    <img src="sponzibob.png" alt="스폰지밥">

</html>
