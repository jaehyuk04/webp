<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <title>라디오 버튼으로 이미지 출력</title>
    <script>
        function drawImage() {
            var fruit = document.getElementsByName("fruit");
            var img = document.getElementById("fruitimage");
            for (var i = 0; i < fruit.length; i++) {
                if (fruit[i].checked == true) {
                    found = fruit[i];
                    img.src = found.value + ".png";
                }
            }
        }
    </script>
</head>

<body onload="drawImage()">
    <h3>라디오 버튼을 클릭하면 이미지를 출력합니다.</h3>
    <hr>
    <form>
        <input type="radio" name="fruit" value="banana" onchange="drawImage()">바나나
        <input type="radio" name="fruit" value="mango" onchange="drawImage()">망고
        <input type="radio" name="fruit" value="apple" onchange="drawImage()" checked>사과
        <br>
        <img id="fruitimage" src="apple.png" alt="" width="250" height="250">
    </form>
</body>

</html>
