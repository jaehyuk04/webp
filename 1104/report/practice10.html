<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>계산기 만들기</title>
<style>
    #display { width: 380px; font-size: 16px; padding: 4px; }
    table { margin-top: 8px; }
    td { padding: 2px 6px; }
    button { width: 70px; height: 26px; }
</style>
<script>
let screen;

function setup() {
    screen = document.getElementById("display");
    screen.value = "0";
}
function press(ch) {
    if (screen.value == "0" && ch != "." ) {
        screen.value = ch;
    } else {
        screen.value += ch;
    }
}

function calc() {
    try {
        screen.value = eval(screen.value);
    } catch (err) {
        screen.value = "오류";
    }
}

function back() {
    let s = screen.value;
    s = s.substring(0, s.length - 1);
    screen.value = (s == "") ? "0" : s;
}

function clearAll() {
    screen.value = "0";
}
</script>
</head>
<body onload="setup()">
<h3>계산기 만들기</h3>
<hr>
<input type="text" id="display" readonly>
<table>
<tr>
    <td><button onclick="back()">BACK</button></td>
    <td><button onclick="clearAll()">CE</button></td>
    <td><button onclick="clearAll()">C</button></td>
    <td><button onclick="calc()">=</button></td>
</tr>
<tr>
    <td><button onclick="press('7')">7</button></td>
    <td><button onclick="press('8')">8</button></td>
    <td><button onclick="press('9')">9</button></td>
    <td><button onclick="press('/')">/</button></td>
</tr>
<tr>
    <td><button onclick="press('4')">4</button></td>
    <td><button onclick="press('5')">5</button></td>
    <td><button onclick="press('6')">6</button></td>
    <td><button onclick="press('*')">*</button></td>
</tr>
<tr>
    <td><button onclick="press('1')">1</button></td>
    <td><button onclick="press('2')">2</button></td>
    <td><button onclick="press('3')">3</button></td>
    <td><button onclick="press('-')">-</button></td>
</tr>
<tr>
    <td><button onclick="press('0')">0</button></td>
    <td><button onclick="press('+')">+</button></td>
    <td><button>NONE</button></td>
    <td><button>NONE</button></td>
</tr>
</table>
</body>
</html>
