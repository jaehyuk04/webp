<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>문자열 분열</title>
</head>

<body>
    <script>
        let s = prompt("문자열 입력", "");
        let parts = s.split("&");
        for (let i = 0; i < parts.length; i++)
            document.write(parts[i] + "<br>");
    </script>

</body>

</html>
