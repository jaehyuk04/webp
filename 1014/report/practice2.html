<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h3>정수 5개 입력 받아 역순으로 입력</h3>
    <hr>

    <script>
        let input = [];
        for(let i = 0; i < 5; i++){
            let n = prompt("정수 입력", " ");
            input[i] = parseInt(n);
        }
        document.write("입력된 수의 배열" + "<br>");
        document.write(input);
        document.write("<hr>");
        document.write("역순으로 재정렬된 배열" + "<br>");
        input.reverse();
        document.write(input);
    </script>
</body>
</html>
