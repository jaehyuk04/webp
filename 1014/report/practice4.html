<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>방문 요일에 따라 변하는 배경</title>
</head>

<body>
    <script>
        let now = new Date();
        let date = now.getDate();
        let day = now.getDay();
        let dayName = ["일요일", "월요일", "화요일", "수요일", "목요일", "금요일", "토요일"];

        if (day == 0) {
            document.body.style.backgroundColor = "pink";
            document.write("<h3>일요일은 pink, 다른 요일은 gold 배경</h3>");
        }
        else {
            document.body.style.backgroundColor = "gold";
            document.write("<h3>일요일은 pink, 다른 요일은 gold 배경</h3>");
        }
        document.write("<hr>");
        document.write("오늘 : " + date + "일 " + dayName[day]);
    </script>
</body>

</html>
