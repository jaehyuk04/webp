<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>소프트웨어 기술 선호에 관한 설문</title>
</head>
<body>
  <header>
    <h1>설문지</h1>
    <hr>
    <p>소프트웨어 기술에 대한 의견을 듣습니다. 많은 참여 부탁드립니다.</p>
  </header>

  <section>
    <form>
      <p>
        학년
        <label><input type="radio" name="grade" checked> 1학년</label>
        <label><input type="radio" name="grade"> 2학년</label>
        <label><input type="radio" name="grade"> 3학년</label>
        <label><input type="radio" name="grade"> 4학년</label>
      </p>

      <p>
        성별
        <label><input type="radio" name="gender"> 남</label>
        <label><input type="radio" name="gender"> 여</label>
      </p>

      <p>
        <label for="field">관심 분야</label>
        <select id="field" name="field">
          <option>모바일 소프트웨어</option>
          <option>웹 프로그래밍</option>
          <option>인공지능</option>
          <option>보안</option>
        </select>
      </p>

      <p>
        진로
        <label><input type="checkbox" name="career" checked> 개발</label>
        <label><input type="checkbox" name="career"> 기획</label>
        <label><input type="checkbox" name="career"> 영업</label>
        <label><input type="checkbox" name="career"> 창업</label>
      </p>

      <p>
        <label>남기고 싶은 말</label><br>
        <textarea rows="6" cols="80" placeholder="글을 남겨주세요"></textarea>
      </p>
    </form>
  </section>

  <footer>
    <p>Copyright 2022 by Kitae</p>
  </footer>

</body>
</html>
