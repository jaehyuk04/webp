  <h2>웹 브라우저 소개</h2>
  <hr>
  <p>
    브라우저라고 불리기도 하는 웹 브라우저(Web Browser)는 사용자에게 웹 서버로부터
    받은 문서, 이미지, 음악, 동영상 등을 다양한 데이터를 다운받아 스크린에
    보여주는 프로그램이다. 그림 1-2는 대표적인 Chrome 웹 브라우저 화면을
    보여준다.
  </p>

  <figure>
    <img src="구글_chorm.png" height = 200 width = 200 alt="구글 chorm">
    <figcaption>그림 1-2 구글 Chrome</figcaption>
  </figure>

  <p>
    웹 페이지는 브라우저에서 실행될 HTML5 문서로서 만들기 위해 코드를 다음과
    같이 작성해야 한다. 그림 1-3은 HTML5 문서 구조를 보여준다.
  </p>

  <figure>
    <code>
      &lt;!doctype html&gt;<br>
      &lt;html&gt;<br>
      &nbsp;&nbsp;...<br>
      &lt;/html&gt;
    </code>
    <figcaption>그림 1-3 HTML5 문서 구조</figcaption>
  </figure>
