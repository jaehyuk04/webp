<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>도형 서식 만들기</title>
</head>
<body>
  <h2>도형 서식 폼 만들기</h2>
  <hr>

  <form>
    <fieldset>
        <legend>도형 서식 입력</legend>
        선종류
        <select>
        <option value="none">선없음</option>
        <option value="solid">실선</option>
        <option value="dotted">점선</option>
        </select>

        선두께
        <input type="number" min="0" value="1">
        <br>
        선색
        <input type="color" value="#3366cc">
        <br>
        투명도(0~100)
        <input type="range" min="0" max="100" value="50">

    </fieldset>
  </form>

</body>
</html>
