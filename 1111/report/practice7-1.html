<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <title>산수를 풀어 봅시다</title>
    <style>
        .q {
            display: inline-block;
            width: 70px;
        }

        .wrong {
            text-decoration: line-through;
        }
    </style>
    <script>
        let answers = [30, 22, 46, 28];

        function grade() {
            let count = 0;
            for (let i = 0; i < answers.length; i++) {
                let q = document.getElementById("q" + i);
                let input = document.getElementById("a" + i).value;

                if (input !== "" && Number(input) === answers[i]) {
                    q.className = "q";
                    count++;
                } else {
                    q.className = "q wrong";
                }
            }
            document.getElementById("result").innerHTML = count;
        }
    </script>
</head>

<body>
    <h3>산수 문제를 풀어 봅시다.</h3>
    <p>수식을 계산하여 답을 입력하고 채점 버튼을 누르세요.</p>
    <hr>
    <div><span class="q" id="q0">5*6</span><input type="text" id="a0"></div>
    <div><span class="q" id="q1">7+5*3</span><input type="text" id="a1"></div>
    <div><span class="q" id="q2">23*2</span><input type="text" id="a2"></div>
    <div><span class="q" id="q3">35-7</span><input type="text" id="a3"></div>
    <button onclick="grade()">채점</button>
    <span id="result">0</span>
</body>

</html>
