<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <title>setInterval()/clearInterval()</title>
    <style>
        div {
            border: 1px solid gray;
            background-color: aliceblue;
            padding: 5px;
            width: 160px;
            cursor: pointer;
        }
    </style>
</head>

<body>
    <h3>div 태그에 시계 만들기</h3>
    <p>시계를 클릭하면 시계가 멈추고 다시 클릭하면 가기 시작한다.</p>
    <hr>
    <div id="div"></div>

    <script>
        let timerID = null;
        let box = document.getElementById("div");

        function clock() {
            let date = new Date();
            let h = date.getHours();
            let day = (h >= 12) ? "오후" : "오전";
            h = h % 12;
            if (h == 0) h = 12;
            box.innerHTML = day + " " + h + ":" + date.getMinutes() + ":" + date.getSeconds();
        }

        function start() {
            clock();
            timerID = setInterval(clock, 1000);
            box.style.color = "black";
        }

        function stop() {
            clearInterval(timerID);
            timerID = null;
            box.style.color = "gray";
        }

        box.onclick = function () {
            if (timerID != null) stop();
            else start();
        };

        start();
    </script>
</body>

</html>
